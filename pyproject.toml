[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-publisher"
version = "0.1.0"
description = "微信公众号自动发布工具 — 从 Markdown 一键发布到微信公众号"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = [
    "click>=8.0",
    "requests>=2.25",
    "markdown>=3.0",
]

[project.scripts]
wechat-publisher = "wechat_publisher.cli:cli"

[tool.setuptools.packages.find]
include = ["wechat_publisher*"]
